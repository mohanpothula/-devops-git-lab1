name: Test and Docker Build
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: docker build -t anycompany-devops:${{ github.sha }} .
      - run: docker run -d --name app -p 8080:5000 anycompany-devops:${{ github.sha }}
      - run: sleep 3 && curl -f http://localhost:8080/health
